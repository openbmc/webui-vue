name: Security Audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (lockfile only)
        run: npm ci --ignore-scripts

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high
